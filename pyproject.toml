[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cutriton"
version = "0.1.0"
description = "基于 CUDA Runtime 与 Triton 的推理引擎核心"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
  {name = "CUTriton 贡献者"}
]
dependencies = []

[project.optional-dependencies]
dev = ["numpy", "pytest"]
triton = ["triton==3.6.0; platform_system == 'Linux' and python_version >= '3.10'"]
onnx = ["onnx"]
benchmark = [
  "onnx==1.22.0",
  "onnxruntime-gpu==1.28.0; platform_system == 'Linux'",
]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
